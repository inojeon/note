name: Publish concept notes

# Publishing is explicit: commits and pull requests do not deploy this site.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: concept-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate self-contained readers
        working-directory: references/sqd-docs
        run: |
          python3 tools/enrich_concepts.py
          python3 tools/build_concepts.py
          node tools/check_html.js docs/concepts.html docs/quantum-chemistry.html
          node tools/check_html.js docs/concepts.html docs/quantum-chemistry.html --narrow
          python3 tools/package_concept_site.py --output "$RUNNER_TEMP/concept-site"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/concept-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the concept reader
        id: deployment
        uses: actions/deploy-pages@v4
