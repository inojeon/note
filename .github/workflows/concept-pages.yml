name: Concept notes

# Pushes and PRs validate; only an explicit Run workflow publishes the tested artifact.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: concept-pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install the pinned standard Hugo binary
        run: |
          mkdir -p test-results
          sh tools/install-hugo.sh 2>&1 | tee test-results/hugo-install.log
          .tools/hugo version | tee test-results/hugo-version.txt

      - name: Build root and GitHub Pages outputs without changing sources
        run: |
          python3 tests/source_digest.py > test-results/source-before.sha256
          .tools/hugo --minify --baseURL http://localhost/ --destination .cache/site-root 2>&1 | tee test-results/build-root.log
          .tools/hugo --minify --baseURL https://inojeon.github.io/note/ --destination public 2>&1 | tee test-results/build-subpath.log
          python3 tests/source_digest.py > test-results/source-after-build.sha256
          cmp test-results/source-before.sha256 test-results/source-after-build.sha256

      - name: Reject invalid authoring inputs and verify the two generated sites
        run: |
          python3 tests/check_curriculum.py 2>&1 | tee test-results/curriculum.log
          python3 tests/build_contract.py 2>&1 | tee test-results/build-contract.log
          node tests/lifecycle.mjs 2>&1 | tee test-results/lifecycle.log
          python3 tests/check_structure.py --site .cache/site-root --base-path / 2>&1 | tee test-results/structure-root.log
          python3 tests/check_structure.py --site public --base-path /note/ 2>&1 | tee test-results/structure-subpath.log

      # Browser tooling belongs to CI; ordinary authoring needs only Hugo and a browser.
      - name: Install the locked browser test dependencies
        run: npm ci --prefix tests --no-audit --no-fund
      - name: Install Chromium, WebKit and Korean fonts
        working-directory: tests
        run: |
          # Avoid slow Azure mirror downloads on hosted runners; apt still verifies signatures.
          for mirror_list in /etc/apt/apt-mirrors*.txt; do
            if [ -f "$mirror_list" ]; then
              sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' "$mirror_list"
            fi
          done
          npx --no-install playwright install --with-deps chromium webkit
          sudo apt-get install --no-install-recommends -y fonts-noto-cjk

      - name: Check both browsers at both deployment paths
        timeout-minutes: 40
        run: |
          status=0
          for browser in chromium webkit; do
            for location in root subpath; do
              if [ "$location" = root ]; then
                site_dir=.cache/site-root
                base_path=/
              else
                site_dir=public
                base_path=/note/
              fi
              if env SITE_DIR="$site_dir" BASE_PATH="$base_path" BROWSER="$browser" node tests/browser.mjs 2>&1 | tee "test-results/browser-$browser-$location.log"; then
                :
              else
                status=1
              fi
            done
          done
          exit "$status"

      - name: Confirm checks did not modify authoring sources or tracked files
        if: ${{ always() && !cancelled() }}
        run: |
          if [ ! -f test-results/source-before.sha256 ]; then
            echo '::error::The initial source fingerprint was not created.'
            exit 1
          fi
          python3 tests/source_digest.py > test-results/source-after-tests.sha256
          cmp test-results/source-before.sha256 test-results/source-after-tests.sha256
          git diff --exit-code
          git status --porcelain --untracked-files=normal > test-results/git-status.txt
          if [ -s test-results/git-status.txt ]; then
            cat test-results/git-status.txt
            echo '::error::Build or validation left changes outside ignored output directories.'
            exit 1
          fi

      - name: Keep validation reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 30

      # No rebuild follows the checks: this is exactly the public/ tree tested above.
      - name: Package the verified Pages output
        if: ${{ success() && github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
          retention-days: 30

  deploy:
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: concept-pages-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the verified artifact
        id: deployment
        uses: actions/deploy-pages@v4
