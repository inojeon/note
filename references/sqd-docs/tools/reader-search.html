<dialog id="reader-search" aria-labelledby="reader-search-title">
<div class="search-heading"><h2 id="reader-search-title">노트 검색</h2><button type="button" id="reader-search-close" aria-label="검색 닫기">닫기</button></div>
<label for="reader-search-input">제목이나 궁금한 개념을 입력하세요</label>
<input type="search" id="reader-search-input" placeholder="예: STO-3G, 큐빗, 에너지, basis" autocomplete="off" spellcheck="false" aria-controls="reader-search-results" autofocus>
<p id="reader-search-status" role="status" aria-live="polite"></p>
<ul id="reader-search-results" aria-label="검색 결과"></ul>
<p class="search-help">Enter로 첫 결과 열기 · ↓로 결과 선택 · Esc로 닫기</p>
</dialog>
