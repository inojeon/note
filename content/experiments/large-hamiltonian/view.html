<section aria-labelledby="large-action-title" class="qc-lab">
<h3 id="large-action-title">전체 행렬 대신 이웃 규칙으로 계산하기</h3>
<p>대각 2, 양옆 대각 −1인 삼중대각 행렬의 설명용 모형입니다. 분자 해밀토니안의 실제 희소 모양은 아닙니다. 양끝 바깥 성분은 0으로 둡니다.</p>
<label for="n">행렬 차원 N <input id="n" type="range" min="3" max="1000" step="1" value="100"><output id="large-n-value" for="n"></output></label>
<div class="qc-presets"><button type="button" data-large-n="3">세 성분 예제</button><button type="button" data-large-n="10">N = 10</button><button type="button" data-large-n="1000">N = 1000</button></div>
<div class="lab-readout"><div>밀집 저장 원소<output data-dense></output></div><div>0이 아닌 원소<output data-sparse></output></div><div>밀집 실수64 저장<output data-bytes></output></div><div>첫 세 Av 성분<output data-product></output></div></div>
<p data-calculation aria-live="polite"></p>
<figure><svg data-pattern role="img" aria-label="삼중대각 행렬의 대각과 이웃 결합"></svg><figcaption data-pattern-caption></figcaption></figure>
<figure><svg data-plot role="img" aria-label="입력 벡터와 이웃 규칙으로 계산한 결과"></svg><figcaption>실선은 입력 v, 점선은 결과 Av입니다. 같은 수치 눈금을 사용합니다. 긴 벡터에서 Av가 작아지는 것은 이 입력과 연산자의 성질이며 별도 확대하지 않습니다.</figcaption></figure>
<p data-comparison></p><button type="button" data-reset>처음 상태로</button>
