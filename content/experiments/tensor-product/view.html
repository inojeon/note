<section class="qc-lab bm-lab" id="bp-lab"><h3>실험 · 두 열벡터에서 네 성분 만들기</h3><p>설명용 두 큐빗을 각각 0 상태에서 출발시켜 Ry 회전 게이트로 준비합니다. 각도는 도(°)이며 두 큐빗 사이에 상호작용 게이트는 없습니다.</p><div class="qc-controls"><label for="bp-a">A 회전각 <input id="bp-a" max="180" min="-180" step="1" type="range" value="90"/><output for="bp-a" id="bp-a-value">90°</output></label><label for="bp-b">B 회전각 <input id="bp-b" max="180" min="-180" step="1" type="range" value="0"/><output for="bp-b" id="bp-b-value">0°</output></label></div><div class="bm-vectors"><div class="bm-vector">A · 0, 1<span class="math-tex" id="bp-va">A 벡터</span></div><span aria-label="텐서곱">⊗</span><div class="bm-vector">B · 0, 1<span class="math-tex" id="bp-vb">B 벡터</span></div><span>≈</span><div class="bm-vector">전체 · 00, 01, 10, 11<span class="math-tex" id="bp-vab">전체 벡터</span></div></div><p>계산 기저(Computational Basis)로 측정할 때의 이론적 확률입니다. 같은 상태를 매번 새로 준비해서 측정하는 상황입니다.</p><div class="bm-bars"><div class="bm-row"><span>00</span><div class="bm-track"><div class="bm-fill" id="bp-bar-0"></div></div><output id="bp-p0">0%</output></div><div class="bm-row"><span>01</span><div class="bm-track"><div class="bm-fill" id="bp-bar-1"></div></div><output id="bp-p1">0%</output></div><div class="bm-row"><span>10</span><div class="bm-track"><div class="bm-fill" id="bp-bar-2"></div></div><output id="bp-p2">0%</output></div><div class="bm-row"><span>11</span><div class="bm-track"><div class="bm-fill" id="bp-bar-3"></div></div><output id="bp-p3">0%</output></div></div><p aria-live="polite" class="qc-status" id="bp-status"></p><div class="qc-presets"><button data-bp-preset="90,0" type="button">왼쪽만 +</button><button data-bp-preset="90,90" type="button">둘 다 +</button><button data-bp-preset="180,90" type="button">왼쪽 1 · 오른쪽 +</button></div><table><caption>네 진폭의 곱셈</caption><thead><tr><th>기저</th><th>A 성분 × B 성분</th><th>진폭</th></tr></thead><tbody id="bp-products"></tbody></table></section>
