<section aria-labelledby="power-lab-title" class="power-lab"><h3 id="power-lab-title">반복할수록 어떤 방향이 남을까?</h3><p>고정된 A = <span aria-label="2, 1; 1, 2" class="math-array" role="math"><span aria-hidden="true" class="math-cells"><span class="math-row"><span>2</span><span>1</span></span><span class="math-row"><span>1</span><span>2</span></span></span></span> 에 대해 ‘곱하기 → 길이를 1로 맞추기’를 반복합니다. 화살표와 고유방향의 성분이 어떻게 변하는지 확인해 보세요.</p><figure><div aria-label="시작 벡터 선택" class="power-presets" role="group"><button data-power-angle="0" type="button">① 보통의 시작 0°</button><button data-power-angle="45" type="button">② 큰 고유방향 45°</button><button data-power-angle="-45" type="button">③ 작은 고유방향 −45°</button><button data-power-angle="-44" type="button">④ 거기서 1° 벗어나기</button></div><label for="power-angle">시작 방향 (x축 기준) <input id="power-angle" max="90" min="-90" step="1" type="range" value="0"/><output for="power-angle" id="power-angle-value"></output></label><label for="power-iteration">반복 횟수 k <input id="power-iteration" max="12" min="0" step="1" type="range" value="0"/><output for="power-iteration" id="power-iteration-value"></output></label><div class="power-step-controls"><button id="power-back" type="button">← 한 단계 전</button><button id="power-next" type="button">한 번 곱하고 정규화 →</button><button id="power-reset" type="button">처음으로</button></div><p aria-live="polite" id="power-message"></p><div class="power-readouts"><div><small>현재 단위 벡터(Unit Vector) vₖ</small><span id="power-vector-value"></span></div><div><small>고유값 근사 · 레일리 몫(Rayleigh Quotient)</small><strong id="power-eigenvalue"></strong></div></div><svg aria-label="반복 벡터와 두 고유방향, 큰 고유방향과 이루는 각도의 변화" id="power-direction-fig" role="img"></svg><figcaption>파랑 화살표는 현재 벡터, 옅은 화살표는 지나온 단계입니다. 연한 파랑은 고유값 3의 방향, 회색은 고유값 1의 방향입니다. 두 번째 그래프는 부호를 구분하지 않은 큰 고유방향과의 각도를 보여 줍니다. 수치는 소수 여섯째 자리까지 반올림합니다.</figcaption><details class="power-step-detail"><summary>이번 단계의 곱셈과 정규화 보기</summary><div id="power-step-calculation"></div></details><details><summary>왜 한 방향이 남을까?</summary><p>두 단위 고유벡터 q₁, q₂의 고유값은 각각 3, 1입니다. 시작 벡터를 v₀ = α₀q₁ + β₀q₂로 쓰면, 정규화 전 Aᵏv₀ = 3ᵏα₀q₁ + β₀q₂입니다.</p><div id="power-component-values"></div><p>정규화는 두 성분을 같은 수로 나누므로 상대 비율을 바꾸지 않습니다. α₀가 0이 아니면 작은 고유방향의 상대 크기 |βₖ/αₖ|는 매회 1/3이 됩니다. α₀ = 0이면 큰 고유방향을 새로 만들지 못합니다.</p></details></figure><p><strong>추천 실험:</strong> ①에서 몇 번 반복한 뒤, ③과 ④를 비교해 보세요. 정확히 작은 고유방향에서 시작할 때와 아주 조금 벗어날 때의 차이를 볼 수 있습니다.</p></section>
