<section aria-labelledby="hamiltonian-lab-title" class="hamiltonian-lab"><h3 id="hamiltonian-lab-title">두 상태가 연결되면 에너지가 어떻게 바뀔까?</h3><p>두 기저 상태(Basis State)의 에너지 a, b와 결합 세기(Coupling Strength) g를 바꿔 보세요. 이 실험은 두 상태 모형이며, 모든 에너지를 같은 임의 단위로 표시합니다.</p><figure><div aria-label="해밀토니안 예시" class="hamiltonian-presets" role="group"><button data-hamiltonian-preset="chemical" type="button">배치 예시: 0.8, −0.5, 1.2</button><button data-hamiltonian-preset="uncoupled" type="button">① 결합 없음</button><button data-hamiltonian-preset="coupled" type="button">② 두 상태 연결</button><button data-hamiltonian-preset="equal" type="button">③ 같은 기저 에너지</button><button data-hamiltonian-preset="degenerate" type="button">④ 같은 고유값</button></div><div class="hamiltonian-inputs"><label for="hamiltonian-a">배치 Φ₁의 에너지 a <input id="hamiltonian-a" max="3" min="0" step="0.1" type="range" value="0.8"/><output for="hamiltonian-a" id="hamiltonian-a-value"></output></label><label for="hamiltonian-b">배치 Φ₂의 에너지 b <input id="hamiltonian-b" max="3" min="0" step="0.1" type="range" value="1.2"/><output for="hamiltonian-b" id="hamiltonian-b-value"></output></label><label for="hamiltonian-g">결합 세기 g <input id="hamiltonian-g" max="2" min="-2" step="0.1" type="range" value="-0.5"/><output for="hamiltonian-g" id="hamiltonian-g-value"></output></label></div><div class="hamiltonian-matrix" id="hamiltonian-matrix"></div><div aria-live="polite" class="hamiltonian-chemical-values" id="hamiltonian-chemical-values"></div><details class="hamiltonian-coupling-note"><summary>결합값의 음수 부호는 무엇을 뜻할까?</summary><p>−0.5는 음의 확률이 아니라, 두 배치를 연결하는 에너지 단위의 행렬원소입니다. 이 실수 모형에서 부호는 낮은 에너지 조합에서 두 계수의 상대 부호에 영향을 줍니다.</p><p>기저 Φ₂의 전체 부호를 바꾸면 g의 부호도 바뀌지만, 에너지 고유값과 물리적 예측은 같습니다. 그러므로 −0.5를 그 자체로 결합 에너지라고 읽지는 않습니다. 화학 결합의 세기는 해리 전후 등의 에너지 차이를 기준으로 따로 정의합니다.</p></details><svg aria-label="기저 상태의 에너지 기댓값과 전체 행렬의 에너지 고유값 비교" id="hamiltonian-energy-fig" role="img"></svg><p aria-live="polite" id="hamiltonian-status"></p><div class="hamiltonian-ground"><div><strong>표시한 바닥상태 c₀</strong><span id="hamiltonian-ground-vector"></span></div><div><strong>기저에서의 관측 확률 |cᵢ|²</strong><div id="hamiltonian-probabilities"></div></div></div><figcaption>기저는 고정된 정규직교 기저이고, 이 모형의 계수는 실수로 제한했습니다. 고유벡터 전체의 부호를 뒤집어도 같은 물리적 상태입니다. 확률은 정규화된 양자 상태의 계수 제곱이며, 일반 벡터의 성분(Component) 제곱을 항상 확률로 해석하는 것은 아닙니다.</figcaption><details><summary>고유값과 바닥상태를 어떻게 계산할까?</summary><div id="hamiltonian-calculation"></div></details><details><summary>다른 상태의 평균 에너지도 비교하기</summary><p>실수 단위 벡터(Unit Vector) c = [cos φ, sin φ]ᵀ로 상태를 바꿔 보세요. 기댓값 cᵀHc는 최소·최대 고유값 사이에 있으며, 바닥상태에서 최솟값을 갖습니다.</p><label for="hamiltonian-state">상태 각도 φ <input id="hamiltonian-state" max="90" min="-90" step="0.1" type="range" value="0"/><output for="hamiltonian-state" id="hamiltonian-state-value"></output></label><button id="hamiltonian-use-ground" type="button">표시한 바닥상태 각도로 맞추기</button><div id="hamiltonian-expectation"></div><p class="meta">각도 슬라이더는 0.1° 간격이므로 맞춤 버튼도 가장 가까운 각도로 반올림합니다.</p></details></figure></section>
