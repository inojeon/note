<section aria-labelledby="bm-title" class="qc-lab"><h3 id="bm-title">실험 · 상태는 그대로, 측정 기준 바꾸기</h3><p>먼저 준비할 상태를 선택한 뒤 측정 기준만 바꿔 보세요. 막대는 매번 같은 상태를 <strong>새로 준비하고 한 번씩 측정</strong>할 때의 이론적 확률입니다.</p>
<div class="qc-controls"><label for="bm-state">준비할 상태 <select id="bm-state"><option value="zero">0 상태</option><option value="one">1 상태</option><option selected="" value="plus">+ 상태</option><option value="minus">− 상태</option><option value="plusi">+i 상태</option></select></label><label for="bm-basis">측정 기준 <select id="bm-basis"><option value="Z">Z · 0과 1 구분</option><option value="X">X · +와 − 구분</option><option value="Y">Y · +i와 −i 구분</option></select></label></div>
<p>준비한 상태의 계산 기저 좌표(Coordinates): <span aria-label="준비한 상태 열벡터" class="math-array" role="math"><span class="math-cells"><span class="math-row"><span id="bm-c0"></span></span><span class="math-row"><span id="bm-c1"></span></span></span></span></p><p id="bm-basis-description"></p>
<figure class="bm-sphere"><h3>3D 블로흐 구 · 상태와 측정 기준</h3><p class="meta" id="bm-orbit-help">드래그·한 손가락·방향키로 보는 방향을 바꿔 보세요. 시점 조작은 상태나 측정 기준을 바꾸지 않습니다.</p><div class="qc-presets"><button id="bm-view-reset" type="button">기본 시점</button></div><svg aria-describedby="bm-orbit-help bm-plane-description" aria-label="준비 상태 화살표, 측정 축과 수직 평면을 표시한 3D 블로흐 구" id="bm-bloch-fig" role="img" tabindex="0"></svg><figcaption><strong>파랑: 준비 상태 · 회색: 측정 축과 수직 평면 · 연한 파랑 점선: 축으로 내린 투영</strong><p id="bm-plane-description"></p><p>측정 기저의 두 상태는 <strong>회색 축 양 끝의 점</strong>입니다. 평면은 두 결과가 50%씩 나오는 상태들의 경계를 보여주는 보조 그림이며, 실제 검출기나 측정 후 상태를 나타내지 않습니다.</p></figcaption><p aria-live="polite" id="bm-projection-description"></p><details><summary>축 방향 성분이 확률과 연결되는 이유</summary><p>준비 상태의 블로흐 벡터(Vector)를 r, 첫째 결과 방향의 단위 벡터(Unit Vector)를 n이라고 하면 확률은 다음과 같습니다.</p><p><span class="math-tex" data-tex="P_+=\frac{1+\mathbf r\cdot\mathbf n}{2}">P(첫째 결과) = (1 + r·n)/2</span></p><p><span class="math-tex" data-tex="P_-=\frac{1-\mathbf r\cdot\mathbf n}{2}">P(둘째 결과) = (1 − r·n)/2</span></p><p> 평면 위에서는 r·n = 0이고, 축의 양 끝에서는 각각 +1과 −1입니다.</p></details></figure><figure><svg aria-label="선택한 측정 기준에서 두 결과의 확률" id="bm-probability-fig" role="img"></svg><figcaption>상태 선택을 유지하면 준비한 상태의 계산 기저 좌표도 유지됩니다. 이 실험은 측정 뒤 상태의 시간 변화를 그리지 않습니다.</figcaption></figure>
<div class="qc-readouts"><div><strong id="bm-label-first"></strong><output id="bm-p-first"></output></div><div><strong id="bm-label-second"></strong><output id="bm-p-second"></output></div></div><p aria-live="polite" class="qc-status" id="bm-status"></p></section>
