<section aria-labelledby="bset-lab-title" class="qc-lab"><h3 id="bset-lab-title">실험: 함수 하나를 더하면 어떤 모양이 생길까?</h3><p>실제 원자 기저 대신 구간 [−1, 1]의 설명용 함수 세 개를 사용합니다. 기저 집합을 순서대로 늘리고, 고정된 목표 함수를 각 함수공간에 직교 투영(Orthogonal Projection)한 최선의 근사와 비교합니다. 근사 함수는 따로 정규화(Normalization)하지 않습니다.</p>
<div class="qc-controls"><label for="bset-size">사용할 함수 수 <input id="bset-size" max="3" min="1" step="1" type="range" value="1"/> <output for="bset-size" id="bset-size-value">1</output></label></div><div aria-label="기저 크기 선택" class="qc-presets" role="group"><button aria-pressed="true" data-bset-size="1" type="button">상수 모양</button><button data-bset-size="2" type="button">+ 기울어진 모양</button><button data-bset-size="3" type="button">+ 휘어진 모양</button></div>
<figure><svg aria-label="목표 함수와 선택한 함수공간에서의 근사" id="bset-approximation-fig" role="img"></svg><figcaption>점선은 고정된 목표 함수 f, 실선은 근사 함수 f̃입니다. x와 함수 값은 무차원(Dimensionless) 설명용 수치입니다. 오차는 곡선 차이의 제곱을 구간 전체에서 적분합니다.</figcaption></figure>
<div class="qc-readouts"><div><small>현재 비직교(Nonorthogonal) 기저에서의 계수 c</small><div id="bset-coefficients"></div><p>겹침 행렬 S</p><div id="bset-overlap"></div></div><div><small>근사 오차 제곱 ∫|f − f̃|² dx</small><output id="bset-error"></output><p>함수의 노름(Norm) 제곱 c†Sc: <strong id="bset-norm"></strong></p><p>계수 제곱 합 Σ|cᵢ|²: <strong id="bset-square-sum"></strong></p></div></div><p aria-live="polite" class="qc-status" id="bset-status"></p>
</section>
