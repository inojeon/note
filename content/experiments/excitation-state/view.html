<section aria-labelledby="sex-title" class="qc-lab sex-lab"><h3 id="sex-title">실험 · 두 전자 배치를 섞기</h3><label for="sex-theta">회로 각도 θ · <output id="sex-angle"></output><input id="sex-theta" max="180" min="0" step="1" type="range" value="90"/></label><div class="qc-presets"><button data-sex-angle="0" type="button">기준 배치만</button><button data-sex-angle="90" type="button">같은 확률</button><button data-sex-angle="180" type="button">들뜬 배치만</button></div><label for="sex-sign">1010의 상대 부호 <select id="sex-sign"><option value="1">+ 같은 부호</option><option value="-1">− 반대 부호</option></select></label><p aria-live="polite" class="sex-formula" id="sex-state"></p><svg aria-label="두 전자 배치의 점유와 측정 확률" id="sex-fig" role="img"></svg><table><thead><tr><th>배치</th><th>진폭</th><th>측정 확률</th></tr></thead><tbody><tr><th>0101</th><td id="sex-c"></td><td id="sex-p0"></td></tr><tr><th>1010</th><td id="sex-s"></td><td id="sex-p1"></td></tr></tbody></table><p>어느 배치가 측정되어도 α 전자 1개, β 전자 1개입니다. 확률의 합은 100%입니다. 진폭 자체를 확률로 읽지 않습니다.</p><p>설명용 H=[[0.8, −0.5], [−0.5, 1.2]]의 평균 에너지: <output id="sex-energy"></output> (임의 단위)</p><p id="sex-cross"></p><p>측정 확률은 같아도 상대 부호가 교차항을 바꿉니다. 실제 H₂의 수치가 아닌 두 배치 모형입니다.</p></section>
