<section class="ssa-lab lab"><h3>실험 · 준비하고, 측정하고, 다시 준비하기</h3><p>앞 노트와 같은 두 배치 중첩을 준비합니다. 각도는 상태 준비 회로의 설정이며, <strong>측정할 때마다 같은 회로를 새로 실행</strong>합니다.</p><label for="ssa-theta">회로 각도 θ: <output id="ssa-angle"></output></label><input id="ssa-theta" max="180" min="0" step="1" type="range" value="60"/><div class="ssa-buttons"><button data-ssa-angle="0" type="button">0° · 기준 배치만</button><button data-ssa-angle="60" type="button">60° · 75:25</button><button data-ssa-angle="90" type="button">90° · 반반</button><button data-ssa-angle="180" type="button">180° · 들뜬 배치만</button></div><p id="ssa-state"></p><p id="ssa-theory"></p><div class="ssa-buttons"><button id="ssa-one" type="button">새로 준비 + 1회 측정</button><button id="ssa-hundred" type="button">새로 준비 + 측정 × 100</button><button id="ssa-reset" type="button">표본 초기화</button></div><p aria-live="polite" id="ssa-last"></p><svg aria-label="두 전자 배치의 측정 빈도와 이론 확률 비교" id="ssa-hist-fig" role="img"></svg><p aria-live="polite" id="ssa-counts"></p><label for="ssa-budget">1010을 발견할 확률을 비교할 샷 수 M <select id="ssa-budget"><option value="1">1</option><option value="10">10</option><option selected value="100">100</option><option value="1000">1000</option></select></label><p id="ssa-discovery"></p><p class="small">색 막대는 실제 표본 비율, 점선은 준비 상태의 이론 확률입니다. 고정 시드의 의사난수로 재현 가능한 이상적 측정을 모의합니다. 실제 장비의 잡음은 포함하지 않습니다. 각도를 바꾸면 표본과 난수 순서를 초기화합니다.</p></section>
