<section class="qc-lab bs-lab"><h3>두 상태 선택과 바깥으로 새는 확률</h3><p>원래 모형의 에너지는 A=0, B=1, C=3입니다. 선택한 두 상태 안의 비율은 36:64로 유지하고, 나머지 상태에 있는 확률을 조절합니다. 에너지는 임의 단위입니다.</p><div class="qc-controls"><label for="bt-pair">계산에 남길 두 상태 <select id="bt-pair"><option value="0,1">A와 B</option><option value="0,2">A와 C</option><option value="1,2">B와 C</option></select></label><label for="bt-leak">제외 상태의 확률 <input id="bt-leak" type="range" min="0" max="50" step="1" value="0"><output id="bt-leak-value"></output></label></div><div class="qc-presets"><button data-bt-leak="0" type="button">누출 없음</button><button data-bt-leak="10" type="button">10% 누출</button></div><div class="bs-grid"><div class="bs-card"><h3>원래 세 상태</h3><table><thead><tr><th>상태</th><th>에너지</th><th>전체 확률</th></tr></thead><tbody id="bt-probabilities"></tbody></table><p id="bt-omitted"></p></div><div class="bs-card"><h3>선택한 두 상태</h3><p id="bt-basis"></p><p id="bt-matrix"></p><p>선택 공간에 남은 확률 <output id="bt-retained"></output></p><p>세 상태 전체의 평균 에너지 <output id="bt-energy"></output></p></div></div><p aria-live="polite" id="bt-summary"></p><p>누출 슬라이더는 확률을 비교하기 위한 모형 입력입니다. 시간 변화나 실제 전이율을 계산한 자료가 아닙니다.</p></section>
