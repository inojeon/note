<section aria-labelledby="int-title" class="qc-lab"><h3 id="int-title">실험: 같은 오비탈의 1전자 에너지와 두 전자의 반발</h3><p>실제 원자 대신 <strong>설명용 이산 두 지점 모형</strong>을 사용합니다. A, B는 고정된 정규직교(Orthonormality) 지점 기저(Basis)입니다. 공간오비탈(Spatial Orbital) <span class="math-tex" data-tex="\phi=\cos\theta\,A+\sin\theta\,B">\phi=\cos\theta\,A+\sin\theta\,B</span>를 α·β 전자 한 개씩이 함께 점유합니다. 숫자는 모두 같은 임의 에너지 단위입니다.</p><figure><div class="qc-controls"><label for="int-angle">오비탈 혼합 각도 θ <input id="int-angle" max="90" min="0" step="1" type="range" value="0"/><output for="int-angle" id="int-angle-value"></output></label></div><div class="qc-equation" id="int-model"></div><div class="qc-readouts"><div><strong>운동 기여 T</strong><output for="int-angle" id="int-t"></output></div><div><strong>핵 인력 기여 V</strong><output for="int-angle" id="int-v"></output></div><div><strong>1전자 적분 h = T + V</strong><output for="int-angle" id="int-h"></output></div><div><strong>2전자 직접 적분 J = (φφ|φφ)</strong><output for="int-angle" id="int-j"></output></div></div><p>두 전자의 합 <span class="math-tex" data-tex="E=2h+J">E=2h+J</span> = <output class="c-value" for="int-angle" id="int-energy"></output></p><svg aria-label="오비탈의 두 지점 밀도와 직접 반발의 지점 쌍별 기여" id="int-density-fig" role="img"></svg><p aria-live="polite" class="qc-status" id="int-status"></p><figcaption>운동 행렬(Matrix) T, 인력 행렬 V와 이산 반발 행렬 G는 설명을 위해 정한 값입니다. α·β 두 전자가 같은 공간오비탈을 점유하는 경우라 직접 반발 J를 한 번 더합니다.</figcaption></figure></section>
