<section class="qc-lab"><h3>실험 · 파동함수와 밀도는 어떻게 다를까?</h3><p class="qc-note">길이 L인 1차원(Dimension) 무한 퍼텐셜 우물(Infinite Potential Well)의 설명용 정상상태(Stationary State)입니다. 원자 오비탈의 모양을 계산한 그림이 아닙니다. 가로축은 위치를 L로 나눈 값입니다.</p><div class="qc-controls"><label for="orb-n">상태 번호 n <input id="orb-n" max="3" min="1" step="1" type="range" value="2"/><output id="orb-n-value"></output></label><label for="orb-edge">측정 영역의 오른쪽 경계 a/L <input id="orb-edge" max="1" min="0" step="0.01" type="range" value="0.5"/><output id="orb-edge-value"></output></label></div><figure><svg aria-label="1차원 파동함수와 확률 밀도 및 선택한 영역" id="orb-density-fig" role="img"></svg><figcaption>위쪽 파동함수의 부호가 달라도, 아래쪽 밀도는 0 이상입니다. 색칠한 위치 영역의 확률은 밀도 그래프 아래의 넓이입니다. 축은 무차원(Dimensionless)화했습니다.</figcaption></figure><div class="qc-readouts"><div><small>왼쪽 끝부터 경계까지의 확률</small><strong id="orb-probability"></strong></div><div><small>우물 내부의 마디(Node) 수</small><strong id="orb-nodes"></strong></div></div><p aria-live="polite" class="qc-status" id="orb-status"></p></section>
