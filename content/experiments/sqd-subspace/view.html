<section class="ssu-lab lab"><h3>실험 · 같은 배치 집합이면 같은 작은 행렬</h3><p>아래 버튼은 측정 결과를 가정한 입력 예시입니다. 비트 순서는 q₃q₂q₁q₀ = β₁ β₀ α₁ α₀이며, 두 배치 모두 α·β 전자가 하나씩 있습니다.</p><div class="ssu-buttons"><button data-ssu-preset="hf" type="button">0101만 100회</button><button data-ssu-preset="rare" type="button">0101 99회 · 1010 1회</button><button data-ssu-preset="balanced" type="button">0101 50회 · 1010 50회</button><button data-ssu-preset="excited" type="button">1010만 100회</button></div><p id="ssu-counts"></p><p aria-live="polite" id="ssu-selected"></p><svg aria-label="선택한 전자 배치에 해당하는 해밀토니안의 행과 열" id="ssu-matrix-fig" role="img"></svg><p class="small">이 행렬은 임의 에너지 단위의 설명용 모형입니다. H₂ 분자의 수치 계산과 구별하며, 두 배치만 있는 모형 안에서 선택 효과를 비교합니다.</p><div class="ssu-result"><p>선택한 부분공간의 최저 에너지: <output id="ssu-energy"></output></p><p>고전 대각화로 다시 구한 상태:</p><div id="ssu-state"></div><p id="ssu-explanation"></p></div></section>
