<section aria-labelledby="cfg-lab-title" class="qc-lab"><h3 id="cfg-lab-title">실험: 같은 a¹b¹에 몇 가지 스핀 점유가 있을까?</h3><p>설명용 정규직교(Orthonormality) 공간 오비탈 a, b와 전자 2개입니다. ↑는 α 스핀, ↓는 β 스핀을 뜻하며 실제 공간 방향이나 전자의 자전 그림이 아닙니다. 여섯 가능한 스핀 궤도 점유 중 하나를 고르세요.</p>
<div class="qc-controls"><label for="cfg-choice">점유 예시 <input id="cfg-choice" max="5" min="0" step="1" type="range" value="1"/> <output for="cfg-choice" id="cfg-choice-value">2 / 6</output></label></div>
<div aria-label="스핀 궤도 점유 선택" class="qc-presets" role="group"><button data-cfg-choice="0" type="button">a↑ a↓</button><button aria-pressed="true" data-cfg-choice="1" type="button">a↑ b↑</button><button data-cfg-choice="2" type="button">a↑ b↓</button><button data-cfg-choice="3" type="button">a↓ b↑</button><button data-cfg-choice="4" type="button">a↓ b↓</button><button data-cfg-choice="5" type="button">b↑ b↓</button></div>
<figure><svg aria-label="두 공간 오비탈의 스핀 점유" id="cfg-occupancy-fig" role="img"></svg><figcaption>박스는 선택한 궤도의 점유를 표시하는 기호이며 실제 위치나 에너지를 나타내지 않습니다. ↑↓가 같은 공간 오비탈에 있어도 서로 다른 두 스핀 궤도를 점유합니다.</figcaption></figure>
<div class="qc-readouts"><div><small>공간 오비탈의 배치</small><output id="cfg-spatial"></output><p>이 공간 배치에 맞는 행렬식 수: <strong id="cfg-count"></strong></p></div><div><small>지금 고른 한 행렬식의 점유 목록</small><output id="cfg-determinant"></output><p>총 스핀 z성분(Component) / ℏ: <strong id="cfg-ms"></strong></p></div></div><p aria-live="polite" class="qc-status" id="cfg-status"></p>
</section>
