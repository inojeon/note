<section class="qc-lab bs-lab"><h3>실험 · 기준 상태 둘, 준비할 상태는 여러 개</h3><p>같은 상태를 매번 새로 준비하고 0·1을 구분하는 측정을 반복한다고 생각해 보세요.</p><div class="qc-controls"><label for="bq-state">준비할 상태 <select id="bq-state"><option value="zero">0 상태</option><option value="one">1 상태</option><option value="plus">+ 상태</option><option value="minus">− 상태</option><option value="plusi">+i 상태</option></select></label></div><div class="bs-state" id="bq-vector"></div><div class="bs-grid"><div class="bs-card">0으로 측정될 확률 <output id="bq-p0"></output><div class="bs-prob"><span id="bq-bar0"></span></div></div><div class="bs-card">1로 측정될 확률 <output id="bq-p1"></output><div class="bs-prob"><span id="bq-bar1"></span></div></div></div><p aria-live="polite" id="bq-explain"></p><p class="bs-caption">확률 막대는 이론값입니다. 실제 유한 횟수의 측정 비율은 흔들릴 수 있습니다.</p></section>
