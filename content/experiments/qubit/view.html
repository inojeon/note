<section class="qc-lab bs-lab"><h3>같은 확률, 다른 상대 부호</h3><p>준비 상태와 측정 기준을 따로 고릅니다. +와 −를 유지한 채 Z·X를 바꾸어 비교할 수 있습니다.</p><div class="qc-controls"><label for="bq-state">준비 상태 <select id="bq-state"><option value="zero">0 상태</option><option value="one">1 상태</option><option value="threefour">3:4 진폭</option><option value="plus">+ 상태</option><option value="minus">− 상태</option><option value="plusi">+i 상태</option></select></label><label for="bq-basis">측정 기준 <select id="bq-basis"><option value="Z">Z · 0과 1</option><option value="X">X · +와 −</option></select></label></div><div class="qc-presets"><button data-bq-example="plus,Z" type="button">+를 Z로</button><button data-bq-example="plus,X" type="button">+를 X로</button><button data-bq-example="minus,X" type="button">−를 X로</button></div><p>계산 기저의 진폭: <output id="bq-vector"></output></p><p id="bq-calculation"></p><div class="bs-grid"><div class="bs-card"><span id="bq-label0">0의 확률</span> <output id="bq-p0"></output><div class="bs-prob"><span id="bq-bar0"></span></div></div><div class="bs-card"><span id="bq-label1">1의 확률</span> <output id="bq-p1"></output><div class="bs-prob"><span id="bq-bar1"></span></div></div></div><p aria-live="polite" id="bq-explain"></p><p>각 기준은 같은 상태를 다시 준비한 별도 측정입니다. 막대는 유한 샷의 빈도가 아닌 이론 확률입니다.</p></section>
