<section aria-labelledby="sdet-lab-title" class="qc-lab"><h3 id="sdet-lab-title">실험: 좌표 이름을 바꾸면 진폭과 확률은?</h3><p>설명용 이산 모형입니다. 같은 스핀 성분을 고정한 두 이산 위치 상태 L, R만 사용합니다. 반대 스핀까지 허용하면 일전자 공간도 더 커집니다. 정규직교 일전자 함수는 각각 L, R에서 다음 열벡터의 값을 가집니다: <span class="math-tex" data-tex="\chi_a=\begin{bmatrix}0.8\\0.6\end{bmatrix},\quad\chi_b=\begin{bmatrix}-0.6\\0.8\end{bmatrix}">χa는 열벡터 0.8, 0.6; χb는 열벡터 −0.6, 0.8</span>. 숫자는 L, R에서의 함수 값이며 원자 위치나 실제 분자 오비탈 값이 아닙니다.</p>
<div aria-label="사용할 스핀 궤도" class="qc-presets" role="group"><button aria-pressed="true" id="sdet-distinct" type="button">서로 다른 정규직교 궤도</button><button aria-pressed="false" id="sdet-duplicate" type="button">같은 궤도를 두 번 넣기</button></div><div class="qc-presets"><button aria-pressed="false" id="sdet-exchange" type="button">전자 좌표 이름 x₁ ↔ x₂</button></div>
<div class="qc-equation" id="sdet-matrix"></div><div class="qc-readouts"><div><small>지정한 좌표 쌍에서의 진폭</small><output id="sdet-amplitude"></output><p>그 좌표 쌍의 확률: <strong id="sdet-probability"></strong></p></div><div><small>전체 함수의 노름 제곱</small><output id="sdet-norm"></output><p id="sdet-validity"></p></div></div>
<figure><svg aria-label="LL, LR, RL, RR에서의 두 전자 진폭" id="sdet-amplitudes-fig" role="img"></svg><figcaption>가로축은 두 전자의 좌표 결과 쌍입니다. 막대는 부호를 가진 진폭입니다. 확률은 각 진폭의 절댓값 제곱이며 서로 다른 좌표 쌍의 확률을 더합니다.</figcaption></figure><p aria-live="polite" class="qc-status" id="sdet-status"></p>
