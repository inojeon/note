<section aria-labelledby="ssc-title" class="qc-lab ssc-lab"><h3 id="ssc-title">실험 · 게이트를 하나씩 적용하기</h3><label for="ssc-theta">상태 준비 각도 θ · <output id="ssc-angle"></output><input id="ssc-theta" max="180" min="0" step="1" type="range" value="90"/></label><div class="qc-presets"><button id="ssc-back" type="button">이전 게이트</button><button id="ssc-next" type="button">다음 게이트</button><button id="ssc-reset" type="button">처음으로</button><button id="ssc-finish" type="button">완성 상태</button></div><p aria-live="polite" class="qc-status" id="ssc-stage"></p><div aria-describedby="ssc-circuit-help" aria-label="상태 준비 회로 · 좌우로 스크롤" class="ssc-circuit-scroll" id="ssc-circuit-scroll" role="region" tabindex="0"><svg aria-label="지금까지 적용한 게이트가 누적된 상태 준비 회로" id="ssc-fig" role="img"></svg></div><p id="ssc-circuit-help">선은 큐빗, ●는 제어, ⊕는 CNOT의 표적입니다. 지금까지 적용한 게이트를 모두 표시하며, 테두리로 강조한 마지막 게이트가 현재 단계입니다. 회로는 왼쪽에서 오른쪽으로 이어집니다. 화면보다 길면 좌우로 밀거나, 회로 영역에 초점을 두고 방향키로 스크롤하세요.</p><table><thead><tr><th>현재 배치</th><th>실수 진폭</th><th>측정 시 확률</th><th>α·β 수</th></tr></thead><tbody id="ssc-amplitudes"></tbody></table><p id="ssc-explanation"></p><p id="ssc-sector"></p><p>이 표는 시뮬레이터가 계산한 상태입니다. 실제 장치에서 한 번 측정하면 이 표 전체가 아니라 비트열 하나를 얻습니다.</p></section>
