<section aria-labelledby="vs-title" class="qc-lab vs-lab"><h3 id="vs-title">같은 상태로 다시 측정해 보기</h3><label for="vs-theta">회전각 θ <output id="vs-angle"></output><input id="vs-theta" max="180" min="-180" step="1" type="range" value="60"/></label><label for="vs-shots">각 항의 측정 횟수 N <select id="vs-shots"><option value="10">10회</option><option selected="" value="100">100회</option><option value="1000">1,000회</option><option value="10000">10,000회</option></select></label><p>전체 상태 준비·측정 횟수: <strong id="vs-total"></strong> (X에 N회 + Z에 N회)</p><div class="qc-presets"><button id="vs-resample" type="button">같은 조건으로 다시 측정</button><button id="vs-reset" type="button">처음으로</button></div><p aria-live="polite" id="vs-run"></p><table><caption>이번 측정 묶음의 결과</caption><thead><tr><th scope="col">항</th><th scope="col">+1 횟수</th><th scope="col">−1 횟수</th></tr></thead><tbody><tr><th scope="row">X</th><td id="vs-xplus"></td><td id="vs-xminus"></td></tr><tr><th scope="row">Z</th><td id="vs-zplus"></td><td id="vs-zminus"></td></tr></tbody></table><figure><svg aria-label="X와 Z 측정 결과 빈도" id="vs-fig" role="img"></svg><figcaption>각 막대 전체가 N회입니다. 파랑은 +1, 회색은 −1 결과입니다.</figcaption></figure><div class="measurement-grid"><div>측정에서 추정한 에너지 (u)<output id="vs-estimate"></output></div><div>이 상태의 정확한 평균 에너지 (u)<output id="vs-exact"></output></div><div>정확한 바닥상태(Ground State) 에너지 (u)<output id="vs-ground"></output></div><div>에너지 추정의 이론적 표준오차(Standard Error) (u)<output id="vs-se"></output></div></div><p id="vs-status"></p><p>횟수가 많으면 <strong>전형적인 흔들림의 크기</strong>가 줄어듭니다. 그러나 한 번 더 측정한 결과가 이전보다 반드시 정확한 것은 아닙니다.</p></section>
