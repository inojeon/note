<p><strong>45°에서 입력 방향을 바꿔 보세요.</strong> 첫 좌표는 언제나 3배, 둘째 좌표는 1배가 됩니다. 대각화(Diagonalization)는 벡터를 고유벡터로 만드는 일이 아니라, 변환을 고유벡터 기저에서 표현하는 일입니다.</p></section>
