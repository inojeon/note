<section class="qc-lab"><h3>실험 · 행렬로 상태를 바꾸기</h3><p>설명용 한 큐빗 실험입니다. 입력과 게이트를 고르면, 항상 <strong>선택한 입력에 고른 게이트를 적용</strong> 적용합니다.</p><div class="qc-controls"><label for="bg-input">입력 상태 <select id="bg-input"><option value="0">0 상태</option><option value="1">1 상태</option><option value="plus">+ 상태</option><option value="minus">− 상태</option><option value="plusi">+i 상태</option></select></label><label for="bg-gate">게이트 <select id="bg-gate"><option value="X">X · 두 성분 맞바꾸기</option><option value="Z">Z · 둘째 성분 부호 반전</option><option value="H">H_gate · 하다마드</option></select></label><label for="bg-times">적용 횟수 <select id="bg-times"><option value="1">한 번</option><option value="2">같은 게이트 두 번</option></select></label></div><p id="bg-first"></p><div class="bridge-flow"><div><small>입력 상태</small><span id="bg-in-vector"></span></div><span>→</span><div><small id="bg-gate-name">게이트</small><span id="bg-matrix"></span></div><span>→</span><div><small>출력 상태</small><span id="bg-out-vector"></span></div></div><div class="qc-readouts"><div><strong>출력의 0 측정 확률</strong><output id="bg-p0"></output></div><div><strong>출력의 1 측정 확률</strong><output id="bg-p1"></output></div><div><strong>입력의 길이 제곱</strong><output id="bg-in-norm"></output></div><div><strong>출력의 길이 제곱</strong><output id="bg-out-norm"></output></div></div><p aria-live="polite" class="qc-status" id="bg-status"></p><p class="qc-note">표시된 계수는 소수 넷째 자리로 반올림한 근삿값입니다. 위 확률은 계산 기저에서 측정할 때의 값입니다. 입력과 출력의 좌표도 모두 같은 계산 기저를 사용합니다. i는 제곱하면 −1이 되는 허수 단위입니다.</p></section>
