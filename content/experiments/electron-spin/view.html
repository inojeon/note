<section class="qc-lab"><h3>실험 · 준비 상태를 고정하고 측정축 돌리기</h3><p class="qc-note">설명용 이상적 스핀 측정입니다. 매번 z축의 양의 스핀 상태를 새로 준비합니다. 측정축은 xz 평면에서 회전합니다. 아래 화살표는 측정 장치의 축이며 전자의 회전이나 이동 경로가 아닙니다.</p><div class="qc-controls"><label for="spin-axis">z축과 측정축 사이 각도 θ <input id="spin-axis" max="180" min="0" step="1" type="range" value="0"/><output id="spin-axis-value"></output></label></div><div class="qc-presets"><button id="spin-same" type="button">같은 축 · 0°</button><button id="spin-perpendicular" type="button">수직 축 · 90°</button><button id="spin-opposite" type="button">반대 축 · 180°</button></div><figure><svg aria-label="준비 상태의 z축과 회전한 측정축 및 결과 확률" id="spin-axis-fig" role="img"></svg><figcaption>각도는 물리적 측정축 사이의 각도입니다. 확률 막대는 매번 같은 상태를 새로 준비해 해당 축에서 측정하는 상황을 나타냅니다.</figcaption></figure><div class="qc-readouts"><div><small>양의 결과 <span class="math-tex" data-tex="+\hbar/2">+ℏ/2</span></small><strong id="spin-plus"></strong></div><div><small>음의 결과 <span class="math-tex" data-tex="-\hbar/2">−ℏ/2</span></small><strong id="spin-minus"></strong></div></div><p>평균 스핀 성분: <output id="spin-mean"></output> <span class="math-tex" data-tex="\hbar">ℏ</span></p><p aria-live="polite" class="qc-status" id="spin-status"></p></section>
