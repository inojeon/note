<section aria-labelledby="sto-lab-title" class="qc-lab"><h3 id="sto-lab-title">비교 · H₂의 기저 집합 바꿔 보기</h3><p>버튼을 눌러 표현에 쓰는 함수 수와 추가되는 자유도를 비교하세요. 같은 분자라도 기저 선택에 따라 계산 공간의 크기가 달라집니다.</p><div aria-label="기저 집합 선택" class="qc-presets" role="group"><button aria-pressed="true" data-sto-basis="sto-3g" type="button">STO-3G</button><button aria-pressed="false" data-sto-basis="6-31g" type="button">6-31G</button><button aria-pressed="false" data-sto-basis="6-31g(d,p)" type="button">6-31G(d,p)</button><button aria-pressed="false" data-sto-basis="6-31++g(d,p)" type="button">6-31++G(d,p)</button><button aria-pressed="false" data-sto-basis="cc-pvdz" type="button">cc-pVDZ</button></div><div class="qc-readouts"><div><strong>수소 원자 하나의 공간 기저 함수</strong><output id="sto-per-atom"></output></div><div><strong>H₂ 전체 공간 기저 함수</strong><output id="sto-total"></output></div></div><p aria-live="polite" id="sto-description"></p><p class="meta">PySCF 기저 자료로 센 수축된 공간 함수의 수입니다. 이 비교는 에너지를 계산하거나 정확도 순위를 매기지 않습니다. 함수 수가 같아도 함수의 모양과 구성은 다를 수 있습니다.</p><figure><svg id="sto-functions" role="img" aria-label="두 수소 원자에 놓은 공간 함수의 종류와 수"></svg><figcaption>각 칸은 수축된 공간 함수 하나입니다. 모양 그림이 아니라 함수 구성을 센 도식입니다.</figcaption></figure><p>두 스핀을 구별하면 <output id="sto-spin-count"></output> 스핀 오비탈입니다.</p></section>
