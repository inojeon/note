<section class="qc-lab"><h3>실험 · 각도와 두 성분을 함께 보기</h3><p>설명용 한 큐빗 모형입니다. 매번 같은 0 상태에서 출발하며, 앞의 회전에 덧붙이지 않습니다.</p><div class="qc-controls"><label for="br-angle">회로 회전각 θ <input id="br-angle" max="720" min="0" step="1" type="range" value="90"/><output id="br-angle-value"></output></label></div><div class="qc-presets"><button id="br-zero" type="button">0° · 0 상태</button><button id="br-quarter" type="button">90° · + 상태</button><button id="br-half" type="button">180° · 1 상태</button><button id="br-turn" type="button">360° · 전역 부호</button></div><div class="bridge-flow"><div><small>회전 전 · 0 상태</small><span class="math-tex" data-tex="\begin{pmatrix}1\\0\end{pmatrix}">\begin{pmatrix}1\\0\end{pmatrix}</span></div><span>→ R<sub>y</sub>(θ) →</span><div><small>회전 후 · 계수 근삿값</small><span id="br-vector"></span></div></div><figure class="br-sphere"><h3>3D 블로흐 구</h3><p class="meta" id="br-orbit-help">그림을 드래그하거나 한 손가락으로 돌려 보세요. 키보드는 그림에 초점을 맞추고 방향키를 누르세요.</p><div aria-label="블로흐 구를 보는 방향" class="qc-presets"><button id="br-view-default" type="button">기본 시점</button><button id="br-view-front" type="button">정면 · x–z 평면</button><button id="br-view-top" type="button">위에서 · x–y 평면</button></div><svg aria-describedby="br-orbit-help br-view-status" aria-label="드래그 또는 방향키로 시점을 바꾸는 3D 블로흐 구" id="br-bloch-fig" role="img" tabindex="0"></svg><p class="meta" id="br-view-status"></p><figcaption>파란 화살표 끝은 현재 상태, 연한 파랑색 원은 R<sub>y</sub>로 도달할 수 있는 경로입니다. 구의 뒤쪽 선은 옅게 표시합니다. 구 표면의 점은 상태를 나타냅니다. 화살표 길이는 항상 1입니다. 이 R<sub>y</sub> 실험은 구 전체가 아니라 x–z 원 위의 상태만 만듭니다.</figcaption></figure><div class="qc-readouts"><div><strong>0 측정 확률</strong><output id="br-p0"></output></div><div><strong>1 측정 확률</strong><output id="br-p1"></output></div><div><strong>계수 계산에 쓰는 각도 θ/2</strong><output id="br-half-angle"></output></div><div><strong>블로흐 좌표(Coordinates) (x, y, z)</strong><output id="br-bloch"></output></div></div><p aria-live="polite" class="qc-status" id="br-status"></p></section>
