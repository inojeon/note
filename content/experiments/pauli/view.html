<section class="qc-lab"><h3>실험 · 공간 오비탈 두 개를 채우기</h3><p class="qc-note">서로 직교하는 공간 오비탈 A·B와 스핀 함수 α·β를 고정한 설명용 점유 모형입니다. 에너지 순서와 전자 사이 반발은 정하지 않았습니다. 버튼을 누르면 해당 스핀 오비탈에 전자 하나를 추가하려고 시도합니다.</p><div aria-label="스핀 오비탈에 전자 추가" class="qc-presets"><button id="pauli-add-aa" type="button">A의 α에 추가</button><button id="pauli-add-ab" type="button">A의 β에 추가</button><button id="pauli-add-ba" type="button">B의 α에 추가</button><button id="pauli-add-bb" type="button">B의 β에 추가</button><button id="pauli-reset" type="button">모두 비우기</button></div><figure><svg aria-label="두 공간 오비탈의 네 스핀 오비탈 점유수" id="pauli-occupation-fig" role="img"></svg><figcaption>화살표는 선택한 축의 두 스핀 상태를 구별하는 표기이며, 전자의 자전 그림이 아닙니다. A·B의 높이는 에너지 차이를 나타내지 않습니다.</figcaption></figure><div class="qc-readouts"><div><small>공간 오비탈 A의 전자 수</small><strong id="pauli-a-count"></strong></div><div><small>공간 오비탈 B의 전자 수</small><strong id="pauli-b-count"></strong></div></div><p>총 전자 수: <output id="pauli-total"></output></p><p aria-live="polite" class="qc-status" id="pauli-status"></p></section>

<div class="qc-presets" aria-label="점유 비교"><button type="button" data-pauli-preset="pair">A에 반대 스핀 둘</button><button type="button" data-pauli-preset="parallel">A·B에 같은 스핀 하나씩</button><button type="button" data-pauli-preset="full">네 자리 모두 채우기</button></div><div class="qc-presets" aria-label="전자 제거"><button type="button" data-pauli-remove="0">Aα 비우기</button><button type="button" data-pauli-remove="1">Aβ 비우기</button><button type="button" data-pauli-remove="2">Bα 비우기</button><button type="button" data-pauli-remove="3">Bβ 비우기</button></div><p class="qc-status" id="pauli-bits" aria-live="polite"></p>
