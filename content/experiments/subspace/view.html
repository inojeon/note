<section aria-labelledby="subspace-lab-title" class="subspace-lab"><h3 id="subspace-lab-title">평면 밖의 벡터를 평면 위로 옮기기</h3><p>파랑 벡터 v를 연한 파랑 평면 W에 직교투영합니다. 평면은 항상 원점을 지나며, x축을 중심으로 기울일 수 있습니다. <strong>연한 파랑 벡터 p는 평면 안에, 회색 차이 r = v−p는 평면에 수직으로</strong> 남습니다.</p><figure><div aria-label="투영 실험 예시" class="subspace-presets" role="group"><button data-subspace-preset="xy" type="button">① xy 평면에 투영</button><button data-subspace-preset="inside" type="button">② 평면 안의 벡터</button><button data-subspace-preset="tilt" type="button">③ 평면을 30° 기울이기</button><button data-subspace-preset="zero" type="button">④ 영벡터</button></div><div class="subspace-inputs"><label for="subspace-x">벡터 x <input id="subspace-x" max="4" min="-4" step="0.5" type="range" value="2"/><output for="subspace-x" id="subspace-x-value"></output></label><label for="subspace-y">벡터 y <input id="subspace-y" max="4" min="-4" step="0.5" type="range" value="3"/><output for="subspace-y" id="subspace-y-value"></output></label><label for="subspace-z">벡터 z <input id="subspace-z" max="4" min="-4" step="0.5" type="range" value="4"/><output for="subspace-z" id="subspace-z-value"></output></label></div><label class="subspace-tilt" for="subspace-tilt">평면의 기울기 θ <input id="subspace-tilt" max="60" min="-45" step="1" type="range" value="0"/><output for="subspace-tilt" id="subspace-tilt-value"></output></label><svg aria-label="3차원 공간의 벡터, 평면 위 투영과 수직인 차이" id="subspace-projection-fig" role="img"></svg><figcaption>파랑: 원래 벡터 v · 연한 파랑: 투영 p · 회색: 차이 r. 사각형은 무한 평면의 일부만 그린 것입니다. 고정 시점에서 3차원(Dimension)을 2차원으로 그렸으므로, 화면에서 보이는 각도가 실제 공간의 직각과 같지는 않습니다.</figcaption><div class="subspace-readouts"><div><small>원래 벡터 v</small><span id="subspace-original"></span></div><div><small>투영 p</small><span id="subspace-projected"></span></div><div><small>차이 r = v−p</small><span id="subspace-residual"></span></div></div><p aria-live="polite" id="subspace-status"></p><details class="subspace-calculation"><summary>투영을 어떻게 계산할까?</summary><p>평면의 정규직교 기저(Orthonormal Basis)를 q₁, q₂로 정하고, 그 열들을 모은 Q를 사용합니다. 벡터에서 각 기저(Basis) 방향의 성분(Component)을 읽은 뒤 그 방향들만 다시 더합니다.</p><div id="subspace-formula-values"></div></details><details id="subspace-nearest"><summary>정말 평면에서 가장 가까운 벡터일까?</summary><p>투영점에서 평면 안의 x축 방향으로 다른 후보 h를 움직여 보세요. 이 후보와 원래 벡터 사이 거리는 투영 거리보다 작아지지 않습니다.</p><label for="subspace-offset">후보 이동량 δ <input id="subspace-offset" max="2" min="-2" step="0.25" type="range" value="1"/><output for="subspace-offset" id="subspace-offset-value"></output></label><p aria-live="polite" id="subspace-distance-values"></p></details></figure><p><strong>비교해 보세요:</strong> xy 평면에서는 z 성분만 없어집니다. 평면을 기울이면 y와 z 성분이 함께 바뀝니다. 이미 평면 안에 있는 벡터는 투영해도 그대로입니다.</p></section>
