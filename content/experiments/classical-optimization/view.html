<section aria-labelledby="vo-title" class="qc-lab"><h3 id="vo-title">실험: 한 걸음씩 에너지 낮추기</h3><p>설명용 한 큐빗 모형이며, 에너지는 임의 단위입니다. <span class="math-tex" data-tex="H=\begin{pmatrix}0.8&amp;-0.5\\-0.5&amp;1.2\end{pmatrix}=I-0.5X-0.2Z">H=\begin{pmatrix}0.8&amp;-0.5\\-0.5&amp;1.2\end{pmatrix}=I-0.5X-0.2Z</span></p><div class="qc-controls"><label>시작 각도 <input id="vo-initial" max="180" min="-180" step="1" type="range" value="0"/><output id="vo-initial-value"></output></label><label>학습률 η <input id="vo-rate" max="6" min="0.1" step="0.1" type="range" value="1"/><output id="vo-rate-value"></output></label></div><div class="qc-presets"><button id="vo-step" type="button">한 번 갱신</button><button id="vo-run" type="button">20번 갱신</button><button id="vo-reset" type="button">다시 시작</button></div><div class="qc-readouts"><div>현재 각도<output id="vo-angle"></output></div><div>평균 에너지<output id="vo-energy"></output></div><div>정확한 최저 에너지와 차이<output id="vo-gap"></output></div><div>갱신 횟수<output id="vo-count"></output></div></div><p id="vo-update" aria-live="polite"></p><svg aria-label="회로 각도에 따른 평균 에너지 곡선과 최적화 경로" id="vo-curve-fig" role="img"></svg><p aria-live="polite" id="vo-status"></p><p>곡선 전체와 정확한 최저점은 학습을 위한 비교 정보입니다. 최적화는 현재 각도 주변의 에너지 정보만 사용하며, 최저점의 위치를 입력받지 않습니다. 각도는 주기적이라 −180°와 180°는 같은 물리적 상태를 나타냅니다.</p></section>
