<section aria-labelledby="var-title" class="qc-lab"><h3 id="var-title">실험: 벡터를 작게 만들면 에너지도 낮아질까?</h3><p>설명용 두 상태 H를 고정합니다. 정규직교 기저(Orthonormal Basis)에서 방향 <span class="math-tex" data-tex="c=(\cos\theta,\sin\theta)^T">c=(\cos\theta,\sin\theta)^T</span>는 정규화되어 있고, 실제 입력 벡터(Vector)는 <span class="math-tex" data-tex="u=sc">u=sc</span>입니다. s를 바꾸어도 정규화된 물리적 상태는 같습니다. 모든 에너지는 임의 단위입니다.</p><figure><div class="qc-equation" id="var-h"></div><div aria-label="시험 공간 예시" class="qc-presets" role="group"><button id="var-basis" type="button">첫째 기저만 사용</button><button id="var-best" type="button">두 기저에서 최적 상태</button></div><div class="qc-controls"><label for="var-angle">방향 θ <input id="var-angle" max="90" min="-90" step="any" type="range" value="0"/><output for="var-angle" id="var-angle-value"></output></label><label for="var-scale">벡터 배율 s <input id="var-scale" max="2" min="0.1" step="0.05" type="range" value="1"/><output for="var-scale" id="var-scale-value"></output></label></div><div class="qc-readouts"><div><strong>노름(Norm) 제곱 uᵀu</strong><output for="var-angle var-scale" id="var-norm"></output></div><div><strong>분자 uᵀHu (정규화 전)</strong><output for="var-angle var-scale" id="var-numerator"></output></div><div><strong>에너지 E = uᵀHu / uᵀu</strong><output for="var-angle var-scale" id="var-energy"></output></div><div><strong>모형의 정확한 E₀와 차이</strong><output for="var-angle var-scale" id="var-gap"></output></div></div><svg aria-label="정규화된 시험 상태의 에너지 곡선과 정확한 바닥 에너지 상계 비교" id="var-bound-fig" role="img"></svg><p aria-live="polite" class="qc-status" id="var-status"></p><figcaption>곡선과 점은 정규화한 에너지입니다. 분자만 작게 만드는 것은 상태의 에너지를 낮추는 일이 아닙니다. “첫째 기저(Basis)만” 버튼은 그 1차원(Dimension) 탐색 공간의 최적 상태를 보여 주고, 슬라이더를 움직이면 두 기저의 혼합을 다시 허용합니다.</figcaption></figure></section>
