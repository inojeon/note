<section aria-labelledby="hf-title" class="qc-lab"><h3 id="hf-title">실험: 밀도로 만든 방정식이 같은 밀도를 돌려줄까?</h3><p>고정된 정규직교(Orthonormality) 지점 기저(Basis) A, B와 전자 2개의 <strong>설명용 제한 하트리–폭(Restricted Hartree–Fock, RHF) 모형</strong>입니다. α·β 전자가 같은 정규화(Normalization) 공간오비탈(Spatial Orbital) <span class="math-tex" data-tex="\phi=\cos\theta\,A+\sin\theta\,B">\phi=\cos\theta\,A+\sin\theta\,B</span>를 점유합니다. 핵 반발은 생략하며, 에너지는 임의 단위입니다.</p><figure><div class="qc-controls"><label for="hf-start">출발 오비탈 각도 θ <input id="hf-start" max="90" min="-90" step="1" type="range" value="0"/><output for="hf-start" id="hf-start-value"></output></label></div><div aria-label="SCF 반복 제어" class="qc-presets" role="group"><button id="hf-step" type="button">SCF 한 번</button><button id="hf-converge" type="button">수렴할 때까지</button><button id="hf-reset" type="button">처음으로</button></div><p class="qc-note" id="hf-iteration"></p><div class="qc-readouts"><div><strong>현재 밀도 P = 2ccᵀ</strong><div id="hf-density"></div></div><div><strong>현재 밀도로 만든 F[P]</strong><div id="hf-fock"></div></div><div><strong>현재 점유 오비탈 c</strong><div id="hf-current"></div></div><div><strong>F의 최저 고유오비탈 c′</strong><div id="hf-next"></div></div></div><div class="qc-readouts"><div><strong>현재 RHF 총 전자 에너지</strong><output id="hf-energy"></output></div><div><strong>F의 최저 오비탈 에너지 ε</strong><output id="hf-epsilon"></output></div><div><strong>입력·출력 밀도 차이 ‖P′ − P‖</strong><output id="hf-residual"></output></div><div><strong>현재 오비탈 각도</strong><output id="hf-angle"></output></div></div><svg aria-label="현재 밀도로 폭 행렬을 만들고 새 점유 오비탈과 밀도를 얻는 반복" id="hf-cycle-fig" role="img"></svg><p aria-live="polite" class="qc-status" id="hf-status"></p><figcaption>“한 번”은 현재 F의 최저 고유오비탈을 새 점유 오비탈로 선택합니다. “수렴할 때까지”는 이 모형에서 밀도 차이가 10⁻¹⁰보다 작아질 때까지, 최대 100번 반복합니다. 슬라이더를 바꾸면 출발점부터 다시 시작합니다.</figcaption></figure></section>
