<section aria-labelledby="hme-title" class="qc-lab"><h3 id="hme-title">실험: 점유를 몇 개 바꾸면 직접 연결이 끊길까?</h3><p>정규직교 스핀오비탈 6개에 같은 스핀 전자 3개를 넣은 <strong>설명용 1·2체 모형</strong>입니다. 점유 번호를 오름차순으로 쓴 행렬식의 위상(Phase) 규약을 고정합니다. 기준 점유는 1, 2, 3입니다. 에너지는 임의 단위로 표시합니다.</p><figure><div class="qc-controls"><label for="hme-replacements">점유 치환 수 k <input id="hme-replacements" max="3" min="0" step="1" type="range" value="0"/><output for="hme-replacements" id="hme-count"></output></label></div><svg aria-label="기준 행렬식과 선택한 행렬식의 오비탈 점유 비교" id="hme-occupations-fig" role="img"></svg><div class="qc-readouts"><div><strong>1전자 항의 행렬원소</strong><output for="hme-replacements" id="hme-one"></output></div><div><strong>2전자 항의 행렬원소</strong><output for="hme-replacements" id="hme-two"></output></div></div><p>합 <span class="math-tex" data-tex="\langle D_k|\hat H|D_0\rangle">\langle D_k|\hat H|D_0\rangle</span> = <output class="c-value" for="hme-replacements" id="hme-total"></output></p><p aria-live="polite" class="qc-status" id="hme-status"></p><figcaption>k는 점유한 스핀오비탈을 다른 스핀오비탈로 바꾼 개수입니다. k = 0은 대각 성분입니다. k = 3의 0은 작은 숫자를 반올림한 결과가 아니라 1·2체 연산자의 선택규칙입니다.</figcaption></figure></section>
