<path d="M70 220H220V120" fill="none" stroke="#475569" stroke-width="2.5" stroke-dasharray="7 6"/>
<path d="M70 220L220 120" stroke="#2563eb" stroke-width="4" fill="none"/>
<path d="M220 120L205 123L213 135Z" fill="#2563eb"/>
<circle cx="70" cy="220" r="4" fill="#334155"/>
