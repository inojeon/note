<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" role="img" aria-labelledby="title desc">
<title id="title">오른쪽 3칸, 위로 2칸의 이동</title>
<desc id="desc">원점에서 오른쪽으로 3칸, 위로 2칸 간 점까지 파란 화살표가 이어집니다. 회색 점선은 가로와 세로 이동량을 표시합니다. 한 칸의 길이는 두 축에서 같습니다.</desc>
<rect width="420" height="300" rx="12" fill="#f8fafc"/>
<g stroke="#e2e8f0" stroke-width="1">
